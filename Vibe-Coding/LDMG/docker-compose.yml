services:
  docker-upgrade-bot:
    build: .
    container_name: docker-upgrade-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - TZ=Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 你的 compose 文件所在根目录（非常重要）
      - /mnt/data1/docker:/mnt/data1/docker
    # 如果需要访问其他路径，继续添加
